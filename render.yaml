databases:
  - name: url-shortener-db
    plan: free
    databaseName: url_shortener
    postgresMajorVersion: "16"

services:
  - type: web
    name: url-shortener-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
